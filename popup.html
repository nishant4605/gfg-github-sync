<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>GeekSync</title>
</head>
<body>
  <h1>GeekSync</h1>

  <label class="row"><input type="checkbox" id="enabled" /> Enable auto-sync</label>

  <section class="card" id="gh">
    <div id="gh-idle">
      <button id="connect">Connect GitHub</button>
      <a id="revoke" class="small" href="https://github.com/settings/applications" target="_blank" hidden>Disconnected. To fully remove access, revoke GeekSync on GitHub →</a>
    </div>
    <div id="gh-pending" hidden>
      <div class="muted">Enter this code on GitHub:</div>
      <div class="code" id="usercode"></div>
      <div class="btns">
        <button id="open-gh">Copy code &amp; open GitHub</button>
        <button id="cancel" class="secondary">Cancel</button>
      </div>
      <div class="muted small">Waiting for you to authorize…</div>
    </div>
    <div id="gh-connected" hidden>
      <span>✅ GitHub: <b id="login"></b></span>
      <button id="logout" class="link">Disconnect</button>
    </div>
    <div id="gh-error" class="err small" hidden></div>
  </section>

  <label>Repository (paste the GitHub URL)
    <input id="repo" placeholder="https://github.com/you/gfg-solutions" />
  </label>
  <label>GFG username (for rank/score)
    <input id="handle" placeholder="your-gfg-handle" />
  </label>

  <details id="advanced">
    <summary>Advanced</summary>
    <label>Branch
      <input id="branch" placeholder="main" />
    </label>
    <label>Commit message template
      <input id="template" />
    </label>
    <label>Personal access token (instead of Connect GitHub)
      <input type="password" id="pat" placeholder="github_pat_..." autocomplete="off" />
    </label>
  </details>

  <div class="btns">
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
  </div>
  <div class="btns">
    <button id="stats" class="secondary">Refresh GFG stats</button>
    <button id="retry" class="secondary">Retry queue (<span id="qcount">0</span>)</button>
  </div>

  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
